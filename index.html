<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彰化美食 AI 隨選地圖</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: #f5f6fa;
            margin: 0;
            padding: 20px;
            color: #2f3640;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2f3640;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #353b48;
        }
        .api-box {
            background-color: #fff5f5;
            border: 1px dashed #ff6b6b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #44bd32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #4cd137;
        }
        #results {
            margin-top: 25px;
        }
        .restaurant-card {
            background: #fff;
            border-left: 5px solid #44bd32;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .no-result {
            text-align: center;
            padding: 30px;
            color: #7f8c8d;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍱 彰化美食 AI 即時隨選地圖</h1>
    
    <div class="api-box">
        <div class="form-group" style="margin-bottom: 0;">
            <label for="apiKey" style="color: #c23616;">🔑 Gemini API Key：</label>
            <input type="password" id="apiKey" placeholder="AQ.Ab8RN6KDojZufwM4n1EhOf5lLHVupfgeQk3wrQtkehQjwe3qDA">
            <small style="color: #7f8c8d; font-size: 12px; display: block; margin-top: 5px;">
                * 留空則會嘗試讀取 app.js 內寫死的 Key。建議在此輸入以防代碼上傳 GitHub 外洩。
            </small>
        </div>
    </div>

    <div class="form-group">
        <label for="cuisine">想吃什麼類型？</label>
        <input type="text" id="cuisine" placeholder="例如：肉圓、爌肉飯、火鍋、飲料..." value="">
    </div>

    <div class="form-group">
        <label for="time">用餐時段</label>
        <select id="time">
            <option value="lunch">🌞 中午 / 下午茶</option>
            <option value="dinner">🌙 晚餐時段</option>
            <option value="midnight">🦉 宵夜凌晨</option>
        </select>
    </div>

    <div class="form-group">
        <label for="distance">搜尋範圍 (公尺)</label>
        <input type="number" id="distance" value="2000" placeholder="例如：2000">
    </div>

    <button onclick="getUserLocation()">🤖 讓 Gemini AI 上網搜尋餐廳</button>

    <div id="results"></div>
</div>

<script src="app.js"></script>
</body>
</html>
