<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運動場館搜尋器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🏋️‍♂️ 運動場館搜尋器 (內嵌地圖版)</h1>
    <p>利用 OpenStreetMap 搜尋地點，並直接在網頁中內嵌 Google Map 畫面！</p>
    
    <div class="search-box">
      <input type="text" id="sportInput" value="羽毛球" placeholder="例如：羽毛球、游泳、健身、籃球">
      <select id="citySelect">
        <option value="25.0339,121.5644">台北市</option>
        <option value="25.0170,121.4626">新北市</option>
        <option value="24.9937,121.3010">桃園市</option>
        <option value="24.1477,120.6736">台中市</option>
        <option value="22.9997,120.2270">台南市</option>
        <option value="22.6273,120.3014">高雄市</option>
      </select>
      <button id="searchBtn">開始搜尋</button>
    </div>

    <div id="loading" class="hidden">🔍 正在為您搜尋運動地點，請稍候...</div>
    <div id="results"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
