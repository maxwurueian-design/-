<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚴‍♂️ 全台22縣市校園與運動場館搜尋器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🏫 全台縣市運動場地搜尋器</h1>
    <p>整合各縣市國民運動中心、市立體育館、國中、國小及運動公園，點選即可內嵌 Google 地圖！</p>
    
    <div class="search-box">
      <select id="citySelect">
        <option value="基隆市">基隆市</option>
        <option value="台北市" selected>台北市</option>
        <option value="新北市">新北市</option>
        <option value="桃園市">桃園市</option>
        <option value="新竹市">新竹市</option>
        <option value="新竹縣">新竹縣</option>
        <option value="苗栗縣">苗栗縣</option>
        <option value="台中市">台中市</option>
        <option value="彰化縣">彰化縣</option>
        <option value="南投縣">南投投縣</option>
        <option value="雲林縣">雲林縣</option>
        <option value="嘉義市">嘉義市</option>
        <option value="嘉義縣">嘉義縣</option>
        <option value="台南市">台南市</option>
        <option value="高雄市">高雄市</option>
        <option value="屏東縣">屏東縣</option>
        <option value="宜蘭縣">宜蘭縣</option>
        <option value="花蓮縣">花蓮縣</option>
        <option value="台東縣">台東縣</option>
        <option value="澎湖縣">澎湖縣</option>
        <option value="金門縣">金門縣</option>
        <option value="連江縣">連江縣 (馬祖)</option>
      </select>

     <select id="sportSelect">
        <option value="all">顯示全部場地 (所有球類/運動)</option>
        <option value="center">綜合/國民運動中心/大型體育館</option>
        <option value="school">校園開放場地 (國中小/高中/大學籃排球)</option>
        <option value="court">專用球場/運動公園 (羽球/網球/桌球/壘球)</option>
      </select>

      <button id="searchBtn">開始搜尋</button>
    </div>

    <div id="loading" class="hidden">🔍 正在動態安全載入地圖中...</div>
    
    <div id="results"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
