<script>
    // ⚠️ 稍後在 Vercel 部署完成後，把這裡換成 Vercel 給你的網址
    // 例如：'https://your-project.vercel.app/api/recommend'
    const BACKEND_URL = '你的VERCEL網址/api/recommend'; 

    async function getRecommendations() {
        const location = document.getElementById('location').value;
        const foodType = document.getElementById('foodType').value;
        const distance = document.getElementById('distance').value;
        const mealTime = document.getElementById('mealTime').value;

        if (!location || !foodType) {
            alert('請填寫目前位置與飲食類型！');
            return;
        }

        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('result').innerHTML = '';
        document.getElementById('submitBtn').disabled = true;

        try {
            // 呼叫我們自己寫的安全後端
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ location, foodType, distance, mealTime })
            });

            const restaurants = await response.json();

            let htmlContent = '';
            restaurants.forEach(rest => {
                htmlContent += `
                    <div class="p-4 border border-gray-100 bg-gray-50 rounded-xl shadow-sm">
                        <h3 class="text-lg font-bold text-gray-800">🏪 ${rest.name}</h3>
                        <div class="text-sm text-gray-600 mt-1 grid grid-cols-2 gap-1">
                            <p><strong>🏷️ 類型:</strong> ${rest.type}</p>
                            <p><strong>📍 距離:</strong> ${rest.distance}</p>
                        </div>
                        <p class="text-sm text-gray-600 mt-2"><strong>⭐ 評價:</strong> ${rest.rating}</p>
                        <div class="mt-2 p-2 bg-blue-50 text-blue-700 text-xs rounded-lg">
                            💡 <strong>推薦理由:</strong> ${rest.reason}
                        </div>
                    </div>
                `;
            });
            document.getElementById('result').innerHTML = htmlContent;

        } catch (error) {
            console.error(error);
            alert('搜尋失敗，請稍後再試。');
        } finally {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('submitBtn').disabled = false;
        }
    }
</script>
